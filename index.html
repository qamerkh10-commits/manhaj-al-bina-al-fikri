<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#182d3b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="البناء الفكري">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>منهج البناء الفكري</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=Noto+Kufi+Arabic:wght@700;800&display=swap" rel="stylesheet">
<script>
// open the page chosen last time, unless the person asked to choose again
try{var w=localStorage.getItem('manhaj-who');if(w&&location.search.indexOf('choose')<0)location.replace(w+'/')}catch(e){}
</script>
<style>
:root{--bg:#f6f2ea;--card:#fff;--ink:#1b2530;--muted:#6b7680;--line:#ebe4d6;--navy:#16303f;--teal:#13806f;--gold:#b88a2e}
@media (prefers-color-scheme:dark){:root{--bg:#0e1418;--card:#151e24;--ink:#e9e6df;--muted:#97a3aa;--line:#24313a;--navy:#e3edf2;--teal:#43c2ae;--gold:#e0b65c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(135deg,#16303f 0%,#1d4152 60%,#13806f 140%);color:#f6f2ea;padding:46px 16px 40px;text-align:center}
h1{font-family:"Noto Kufi Arabic",sans-serif;font-weight:800;font-size:clamp(26px,5vw,38px);margin:0}
header p{opacity:.8;margin:8px 0 0}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:34px 16px 50px}
h2{font-size:17px;color:var(--muted);font-weight:600;text-align:center;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
a.who{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 22px;box-shadow:0 10px 30px -14px rgba(22,48,63,.25);transition:transform .15s,box-shadow .15s}
a.who:hover,a.who:focus-visible{transform:translateY(-2px);box-shadow:0 16px 36px -14px rgba(22,48,63,.35);outline:none}
.av{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:"Noto Kufi Arabic";font-weight:800;font-size:24px;color:#fff;margin-bottom:14px}
.who h3{font-family:"Noto Kufi Arabic";font-size:22px;margin:0 0 4px;color:var(--navy)}
.who span{color:var(--muted);font-size:14px}.who b{display:inline-block;margin-top:14px;color:var(--teal);font-weight:600}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 24px}
</style></head>
<body><header><h1>منهج البناء الفكري</h1><p>خطة قراءة يومية في الفكر الإسلامي والعلوم الإنسانية والتراث</p></header>
<main><h2>اختر صفحتك</h2><div class="grid">
<a class="who" href="khaled/" data-who="khaled"><div class="av" style="background:#13806f">خ</div><h3>خالد</h3><span>خطته وتقدّمه ومتابعته على البوت</span><br><b>ادخل صفحتك ←</b></a>
<a class="who" href="mohamed/" data-who="mohamed"><div class="av" style="background:#b88a2e">م</div><h3>محمد</h3><span>خطته وتقدّمه ومتابعته على البوت</span><br><b>ادخل صفحتك ←</b></a>
</div></main>
<dialog id="dlDlg"><div class="dlg"><h3 style="font-size:18px;color:var(--navy);margin-bottom:10px">تنزيل التطبيق</h3><div id="dlBody" style="font-size:15px;line-height:1.9"></div><div style="text-align:center;margin-top:16px"><button class="btn primary" onclick="document.getElementById('dlDlg').close()">تمام</button></div></div></dialog>

<footer>كل صفحة تحفظ تقدّم صاحبها على جهازه، ويتابعه البوت بتفاصيله هو.</footer>
<script>document.querySelectorAll('a.who').forEach(function(a){a.addEventListener('click',function(){try{localStorage.setItem('manhaj-who',a.dataset.who)}catch(e){}})})</script>
<script>
if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;let rl=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!rl){rl=true;location.reload()}});addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{}))}
(function(){
 const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
 const b=document.getElementById('dlBtn'); if(!b)return;
 if(standalone){b.style.display='none';return}
 let dp=null; addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});
 addEventListener('appinstalled',()=>{b.style.display='none'});
 const ua=navigator.userAgent, ios=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1), safari=/safari/i.test(ua)&&!/crios|fxios|edgios/i.test(ua);
 b.onclick=()=>{
  if(dp){dp.prompt();dp.userChoice.finally(()=>{dp=null});return}
  const body=document.getElementById('dlBody');
  if(ios) body.innerHTML=safari?'<ol style="padding-inline-start:20px;margin:0"><li>اضغط زر <b>المشاركة</b> (مربع يخرج منه سهم) أسفل الشاشة.</li><li>اختر <b>«إضافة إلى الشاشة الرئيسية»</b>.</li><li>اضغط <b>«إضافة»</b>.</li></ol>':'على الآيفون يُنزَّل التطبيق من <b>Safari</b> فقط: انسخ الرابط وافتحه في Safari، ثم اضغط زر المشاركة واختر «إضافة إلى الشاشة الرئيسية».';
  else body.innerHTML='<ol style="padding-inline-start:20px;margin:0"><li>افتح قائمة المتصفح (النقاط الثلاث ⋮).</li><li>اختر <b>«تثبيت التطبيق»</b> أو <b>«إضافة إلى الشاشة الرئيسية»</b>.</li></ol><p class="muted small" style="margin-top:8px">إن لم يظهر الخيار، افتح الرابط في Chrome أو Edge.</p>';
  document.getElementById('dlDlg').showModal();
 };
})();
</script>
</body></html>
